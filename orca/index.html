<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Orca で開く</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; line-height: 1.6; }
  a.btn { display: inline-block; padding: .6em 1.2em; background: #2f6fb5; color: #fff; border-radius: 6px; text-decoration: none; font-size: 1.1em; }
  .err { color: #b00020; }
</style>
</head>
<body>
<!-- orca/index.html v0.1 2026-11-17
     URL の # の後ろ(row・step・f)を読み、aidev-orca://kaigi/ へ移るだけのページ。claude-start と同じ作り。
     # の後ろはブラウザの外(このサーバー)へ送られない。移る先は aidev-orca://kaigi/ だけ。頼みの文は持たない(パソコンの起動口が組む)。 -->
<h1>Orca で開く</h1>
<p id="msg">準備中…</p>
<p><a id="go" class="btn" href="#" hidden>Orca で開く</a></p>
<script>
(function () {
  'use strict';
  function fail(text) { var m = document.getElementById('msg'); m.textContent = text; m.className = 'err'; }
  var p;
  try { var h = String(location.href); var at = h.indexOf('#'); p = new URLSearchParams(at === -1 ? '' : h.slice(at + 1)); }
  catch (e) { fail('リンクの形が読めませんでした。'); return; }
  var row = (p.get('row') || '').toLowerCase();
  var step = p.get('step') || '';
  var f = p.get('f') || '';
  if (!/^[0-9a-f]{32}$/.test(row)) { fail('行の ID の形が違います。'); return; }
  if (['mae', 'naka', 'ato', 'atono'].indexOf(step) === -1) { fail('手順の名前が違います。'); return; }
  if (f && (!/^[A-Za-z0-9_\\]+$/.test(f) || f.indexOf('..') !== -1)) { fail('開くフォルダの形が違います。'); return; }
  var target = 'aidev-orca://kaigi/?row=' + row + '&step=' + step + '&f=' + encodeURIComponent(f);
  var go = document.getElementById('go');
  go.href = target; go.hidden = false;
  document.getElementById('msg').textContent = 'Orca で Claude Code を開きます。開かないときは下のボタンを押してください。';
  window.location.href = target;
})();
</script>
</body>
</html>
